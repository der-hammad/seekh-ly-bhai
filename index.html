<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch von Null</title>
<style>
:root{--bg:#e9eef3;--card:#fbfcfd;--ink:#14213d;--mut:#5b6679;--line:#cfd7e2;--acc:#14213d;--onacc:#fff;--ok:#1d7a46;--bad:#b3261e;--m:#1f5fbf;--f:#c2362b;--n:#2b8a57;--gold:#e8b100;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#17212f;--ink:#eaf0f8;--mut:#98a6bb;--line:#2a374a;--acc:#e8b100;--onacc:#14213d;--ok:#5fd18f;--bad:#ff8f86;--m:#7fb0ff;--f:#ff938a;--n:#6fd6a0}}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 16px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.stats{display:flex;gap:14px;font-size:14px;color:var(--mut)}
.stats b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
.de{font-size:44px;font-weight:700;line-height:1.1;margin:4px 0 6px;letter-spacing:-.02em}
.m{color:var(--m)}.f{color:var(--f)}.n{color:var(--n)}
.pron{font-size:20px;color:var(--mut)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0;font-size:15px}
.meta dt{color:var(--mut)}.meta dd{margin:0}
.tip{border-left:3px solid var(--gold);padding:2px 12px;margin:14px 0;font-size:15px}
button{font:inherit;min-height:44px;touch-action:manipulation;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
input[type=text],textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:110px;font-size:16px;font-family:ui-monospace,Menlo,monospace}
.q{font-size:20px;margin:6px 0 14px}
.tag{font-size:13px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--gold)}
.fb{padding:12px 14px;border-radius:10px;margin-top:14px;font-size:15px}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);border:1px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);border:1px solid var(--bad)}
.fb div{margin:3px 0}
.tiles button{padding:8px 12px}
.tray{min-height:48px;border:1px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lesson h3{margin:0;font-size:17px}
.lesson p{margin:2px 0 0;color:var(--mut);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.sent{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sent small{display:block;color:var(--mut)}
.note{font-size:13px;color:var(--mut)}
.hit{color:var(--ok);font-weight:600}.miss{color:var(--bad);font-weight:600;text-decoration:underline wavy}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<main>
<header><h1>Deutsch von Null</h1><div class="stats" id="stats"></div></header>
<div id="app"></div>
<p class="note" id="audioNote"></p>
</main>
<script>
/* ---------- Curriculum (data-driven: add lessons here) ---------- */
const LESSONS=[
{id:1,title:"Hallo! First words",goal:"Greet someone and say what something is.",
 items:[
  {id:'hallo',de:'Hallo',en:'hello',acc:['hello','hi'],pron:'HAH-loh',type:'greeting',ex:'Hallo!',exEn:'Hello!',tip:'Stress the first syllable. The h is a light breath, like in English “hello”.'},
  {id:'haus',art:'das',de:'Haus',en:'the house',acc:['house','the house'],pron:'dahs HOWSS',type:'noun',gender:'neuter',plural:'die Häuser',ex:'Das ist das Haus.',exEn:'That is the house.',tip:'“au” sounds like “ow” in “cow”. The s at the end is sharp, like in “hiss”.'},
  {id:'frau',art:'die',de:'Frau',en:'the woman',acc:['woman','the woman'],pron:'dee FROW',type:'noun',gender:'feminine',plural:'die Frauen',ex:'Das ist die Frau.',exEn:'That is the woman.',tip:'Same “au” as in Haus. The r is made softly at the back of the throat.'},
  {id:'dasist',de:'Das ist …',en:'That is … / This is …',acc:['that is','this is','thats','that s'],pron:'dahs isst',type:'sentence pattern',ex:'Das ist das Haus.',exEn:'That is the house.',tip:'Word order: Das (that) + ist (is) + the thing. Das is also the neuter article, but here it means “that”.',parts:'Das = that · ist = is · das Haus = the house'}
 ],
 sents:[
  {de:'Das ist das Haus.',en:'That is the house.',it:'haus',bl:2},
  {de:'Das ist die Frau.',en:'That is the woman.',it:'frau',bl:2}
 ]},
{id:2,title:"Wo ist …? Asking and answering",goal:"Ask where something is and answer. Reuses das Haus, die Frau and Das ist.",
 items:[
  {id:'tuer',art:'die',de:'Tür',en:'the door',acc:['door','the door'],pron:'dee TÜÜR',type:'noun',gender:'feminine',plural:'die Türen',ex:'Das ist die Tür.',exEn:'That is the door.',tip:'ü: shape your lips as for “oo”, then say “ee” without moving them.'},
  {id:'wo',de:'Wo ist …?',en:'Where is …?',acc:['where is'],pron:'voh isst',type:'question pattern',ex:'Wo ist die Frau?',exEn:'Where is the woman?',tip:'German w sounds like English v. The verb ist comes second, right after Wo.',parts:'Wo = where · ist = is · die Frau = the woman'},
  {id:'hier',de:'Hier ist …',en:'Here is …',acc:['here is'],pron:'heer isst',type:'sentence pattern',ex:'Hier ist die Frau.',exEn:'Here is the woman.',tip:'“ie” is a long “ee”. Again ist stays in second position.',parts:'Hier = here · ist = is · die Frau = the woman'}
 ],
 sents:[
  {de:'Wo ist die Frau?',en:'Where is the woman?',it:'frau',bl:2},
  {de:'Hier ist die Frau.',en:'Here is the woman.',it:'frau',bl:2},
  {de:'Wo ist das Haus?',en:'Where is the house?',it:'haus',bl:2},
  {de:'Hier ist die Tür.',en:'Here is the door.',it:'tuer',bl:2}
 ]}
];
LESSONS.push(
{id:3,title:"Ein or eine? A and an",goal:"Say “a house” or “a woman” and answer yes or no. Reuses das Haus, die Frau, die Tür and Das ist.",
 note:'A yes/no question starts with the verb: <b>Ist</b> das …? Use <b>ein</b> before das nouns and <b>eine</b> before die nouns.',
 items:[
  {id:'ein',de:'ein / eine',en:'a / an',acc:['a','an','a an','a / an','a/an'],accDe:['ein eine','ein/eine'],pron:'ine / INE-uh',type:'indefinite article',ex:'Das ist ein Haus.',exEn:'That is a house.',tip:'“ei” sounds like English “eye”, so ein is “ine”. Use ein with das and der nouns, eine with die nouns.',parts:'ein Haus (das) · eine Frau (die) · eine Tür (die)'},
  {id:'ja',de:'Ja',en:'yes',acc:['yes'],pron:'yah',type:'answer word',ex:'Ja, das ist die Frau.',exEn:'Yes, that is the woman.',tip:'German j sounds like English y, so Ja is “yah”.'},
  {id:'nein',de:'Nein',en:'no',acc:['no'],pron:'nine',type:'answer word',ex:'Nein, das ist die Tür.',exEn:'No, that is the door.',tip:'Same “ei” as in ein, like English “eye”.'}
 ],
 sents:[
  {de:'Das ist ein Haus.',en:'That is a house.',it:'ein',bl:2,why:'Haus is neuter (das Haus), so a/an is <b>ein</b>.'},
  {de:'Das ist eine Frau.',en:'That is a woman.',it:'ein',bl:2,why:'Frau is feminine (die Frau), so a/an is <b>eine</b>.'},
  {de:'Ist das eine Tür?',en:'Is that a door?',it:'ein',bl:2,why:'Tür is feminine (die Tür), so a/an is <b>eine</b>.'},
  {de:'Ja, das ist die Tür.',en:'Yes, that is the door.',it:'ja'},
  {de:'Nein, das ist das Haus.',en:'No, that is the house.',it:'nein'}
 ]},
{id:4,title:"Der Mann and Ich bin",goal:"Meet your first masculine noun and say who you are. Reuses ein, eine, Wo ist …? and Das ist.",
 note:'<b>Ich bin</b> means “I am”. It is the “I” form of sein (to be). The verb stays in second position. Masculine nouns take <b>der</b>, and <b>ein</b> for “a”.',
 items:[
  {id:'mann',art:'der',de:'Mann',en:'the man',acc:['man','the man'],pron:'dair MAHN',type:'noun',gender:'masculine',plural:'die Männer',ex:'Das ist der Mann.',exEn:'That is the man.',tip:'Short a, and hold the nn briefly. der is pronounced “dair”.'},
  {id:'ichbin',de:'Ich bin …',en:'I am …',acc:['i am','im'],pron:'ikh bin',type:'sentence pattern',ex:'Ich bin ein Mann.',exEn:'I am a man.',tip:'ich ends in a soft hiss made with the tongue near the roof of the mouth, close to the h in English “huge”. Do not say “ick”.',parts:'Ich = I · bin = am · ein Mann = a man'},
  {id:'und',de:'und',en:'and',acc:['and'],pron:'oont',type:'connector',ex:'Der Mann und die Frau.',exEn:'The man and the woman.',tip:'u as in “put”. The final d sounds like t.'}
 ],
 sents:[
  {de:'Das ist der Mann.',en:'That is the man.',it:'mann',bl:2},
  {de:'Wo ist der Mann?',en:'Where is the man?',it:'mann',bl:2},
  {de:'Ich bin ein Mann.',en:'I am a man.',it:'ichbin',bl:2,why:'Mann is masculine (der Mann), so a/an is <b>ein</b>.'},
  {de:'Ich bin eine Frau.',en:'I am a woman.',it:'ichbin',bl:2,why:'Frau is feminine (die Frau), so a/an is <b>eine</b>.'},
  {de:'Der Mann und die Frau.',en:'The man and the woman.',it:'und'}
 ]},
{id:5,title:"Wer ist das? Er and sie",goal:"Ask who someone is and say he or she. Reuses der Mann, die Frau, Wo ist …? and hier.",
 note:'<b>Er</b> means “he” and <b>sie</b> means “she”. The verb <b>ist</b> stays in second position, right after er or sie. (Sie has other meanings too, which come later.)',
 items:[
  {id:'wer',de:'Wer ist das?',en:'Who is that?',acc:['who is that','who is this','whos that','whos this'],pron:'vair isst dahs',type:'question pattern',ex:'Wer ist das?',exEn:'Who is that?',tip:'w is “v” again. The r after e is soft, so Wer sounds like “vair”.',parts:'Wer = who · ist = is · das = that'},
  {id:'er',de:'Er',en:'he',acc:['he'],pron:'air',type:'pronoun',ex:'Er ist hier.',exEn:'He is here.',tip:'Say “air” with a very soft r. Er replaces der Mann.'},
  {id:'sie',de:'Sie',en:'she',acc:['she'],pron:'zee',type:'pronoun',ex:'Sie ist hier.',exEn:'She is here.',tip:'German s before a vowel is voiced like English z, and ie is a long “ee”. Sie replaces die Frau.'}
 ],
 sents:[
  {de:'Wer ist das?',en:'Who is that?',it:'wer'},
  {de:'Er ist der Mann.',en:'He is the man.',it:'er',bl:2},
  {de:'Sie ist die Frau.',en:'She is the woman.',it:'sie',bl:2},
  {de:'Wo ist er?',en:'Where is he?',it:'er',bwhy:'Question words like Wo come first, then the verb ist, then the subject.'},
  {de:'Sie ist eine Frau.',en:'She is a woman.',it:'sie',bl:2,why:'Frau is feminine (die Frau), so a/an is <b>eine</b>.'}
 ]}
);
LESSONS.push(
{id:6,title:"Guten Tag! Manners",goal:"Greet politely, say thank you and say please. Reuses Hallo, Ja, Nein and die Frau.",
 note:'<b>Guten Tag</b> is the polite daytime greeting. <b>Hallo</b> is casual. <b>Bitte</b> means both “please” and “you are welcome”.',
 items:[
  {id:'gutentag',de:'Guten Tag',en:'Good day / Hello (polite)',acc:['good day','hello','good afternoon','hello polite'],pron:'GOO-ten TAHK',type:'greeting',ex:'Guten Tag, Frau Müller.',exEn:'Good day, Ms Müller.',tip:'g is hard, as in “go”. The final g in Tag sounds like k.'},
  {id:'danke',de:'Danke',en:'thank you / thanks',acc:['thanks','thank you'],pron:'DAHN-kuh',type:'manners',ex:'Nein, danke.',exEn:'No, thank you.',tip:'The final e is a short, relaxed “uh”. Stress the first syllable.'},
  {id:'bitte',de:'Bitte',en:'please / you are welcome',acc:['please','you are welcome','youre welcome','you re welcome'],pron:'BIT-tuh',type:'manners',ex:'Ja, bitte.',exEn:'Yes, please.',tip:'Short i as in “bit”, and a relaxed “uh” at the end.'}
 ],
 sents:[
  {de:'Guten Tag!',en:'Good day!',it:'gutentag'},
  {de:'Guten Tag, Frau Müller.',en:'Good day, Ms Müller.',it:'gutentag'},
  {de:'Danke, Frau Müller.',en:'Thank you, Ms Müller.',it:'danke'},
  {de:'Nein, danke.',en:'No, thank you.',it:'danke'},
  {de:'Ja, bitte.',en:'Yes, please.',it:'bitte'}
 ]},
{id:7,title:"Eins, zwei, drei and plurals",goal:"Count to three and talk about more than one thing. Reuses Haus, Frau, Tür and Wo ist …?",
 note:'With more than one thing, <b>ist</b> becomes <b>sind</b> (are) and the noun is plural. Plurals are mostly irregular, so learn each one with its noun.',
 plurals:['haus','frau','tuer','mann'],
 items:[
  {id:'eins',de:'eins',en:'one',acc:['one','1'],pron:'ines',type:'number',ex:'Eins, zwei, drei.',exEn:'One, two, three.',tip:'ei sounds like English “eye”. The s at the end is sharp.'},
  {id:'zwei',de:'zwei',en:'two',acc:['two','2'],pron:'tsvy',type:'number',ex:'Hier sind zwei Frauen.',exEn:'Here are two women.',tip:'German z is “ts”, as in “cats”. Then v, then “eye”.'},
  {id:'drei',de:'drei',en:'three',acc:['three','3'],pron:'dry',type:'number',ex:'Das sind drei Häuser.',exEn:'Those are three houses.',tip:'Say “dry” with a soft German r made at the back of the throat.'}
 ],
 sents:[
  {de:'Eins, zwei, drei.',en:'One, two, three.',it:'eins'},
  {de:'Hier sind zwei Frauen.',en:'Here are two women.',it:'zwei',bwhy:'With more than one thing, ist becomes sind and the noun is plural: zwei Frauen.'},
  {de:'Das sind drei Häuser.',en:'Those are three houses.',it:'drei',bwhy:'Das sind … is the plural of Das ist …, and Haus becomes Häuser.'},
  {de:'Wo sind die Türen?',en:'Where are the doors?',it:'wo',bwhy:'Wo sind … is the plural of Wo ist …. The verb stays in second position.'},
  {de:'Hier sind zwei Türen.',en:'Here are two doors.',it:'zwei',bwhy:'zwei is followed by a plural noun: Türen.'}
 ]},
{id:8,title:"Die Familie",goal:"Talk about your family. Reuses der Mann, die Frau, Ich bin …, und and sind.",
 note:'Family words have fixed genders: <b>der</b> Vater, <b>die</b> Mutter, <b>die</b> Familie. Say each one with its article every time.',
 plurals:['mutter','vater','familie'],
 items:[
  {id:'familie',art:'die',de:'Familie',en:'the family',acc:['family','the family'],pron:'dee fah-MEE-lee-uh',type:'noun',gender:'feminine',plural:'die Familien',ex:'Das ist die Familie.',exEn:'That is the family.',tip:'Stress the second syllable (mee). The ending -ie is said “ee-uh”.'},
  {id:'mutter',art:'die',de:'Mutter',en:'the mother',acc:['mother','the mother','mum','mom'],pron:'dee MUT-ter',type:'noun',gender:'feminine',plural:'die Mütter',ex:'Das ist die Mutter.',exEn:'That is the mother.',tip:'Short u as in “put”, and hold the tt briefly. The final -er is a relaxed “uh”.'},
  {id:'vater',art:'der',de:'Vater',en:'the father',acc:['father','the father','dad'],pron:'dair FAH-ter',type:'noun',gender:'masculine',plural:'die Väter',ex:'Das ist der Vater.',exEn:'That is the father.',tip:'German V is usually pronounced like English f.'}
 ],
 sents:[
  {de:'Das ist die Mutter.',en:'That is the mother.',it:'mutter',bl:2},
  {de:'Das ist der Vater.',en:'That is the father.',it:'vater',bl:2},
  {de:'Wo ist die Familie?',en:'Where is the family?',it:'familie',bl:2},
  {de:'Ich bin der Vater.',en:'I am the father.',it:'vater',bl:2},
  {de:'Der Vater und die Mutter sind hier.',en:'The father and the mother are here.',it:'und',bwhy:'Two people means sind, not ist.'}
 ]},
{id:9,title:"Brot, Wasser, Milch",goal:"Name basic food and drink and ask for it politely. Reuses Das ist …, Wo ist …?, Ja, Nein, danke and bitte.",
 note:'When you ask for something, you can drop the article: <b>Wasser, bitte.</b>',
 plurals:['brot'],
 items:[
  {id:'brot',art:'das',de:'Brot',en:'the bread',acc:['bread','the bread'],pron:'dahs BROHT',type:'noun',gender:'neuter',plural:'die Brote',ex:'Das ist das Brot.',exEn:'That is the bread.',tip:'Long o, and a crisp t at the end.'},
  {id:'wasser',art:'das',de:'Wasser',en:'the water',acc:['water','the water'],pron:'dahs VAH-ser',type:'noun',gender:'neuter',ex:'Das ist das Wasser.',exEn:'That is the water.',tip:'w sounds like v. The final -er is a relaxed “uh”. Water has no common plural.'},
  {id:'milch',art:'die',de:'Milch',en:'the milk',acc:['milk','the milk'],pron:'dee MILKH',type:'noun',gender:'feminine',ex:'Das ist die Milch.',exEn:'That is the milk.',tip:'ch after i is the soft hiss from ich, not a k. Milk has no common plural.'}
 ],
 sents:[
  {de:'Das ist das Brot.',en:'That is the bread.',it:'brot',bl:2},
  {de:'Das ist die Milch.',en:'That is the milk.',it:'milch',bl:2},
  {de:'Wo ist das Wasser?',en:'Where is the water?',it:'wasser',bl:2},
  {de:'Wasser, bitte.',en:'Water, please.',it:'wasser',bwhy:'When ordering, German often drops the article.'},
  {de:'Ja, bitte, das Brot.',en:'Yes, please, the bread.',it:'brot'}
 ]},
{id:10,title:"Boss round: Die Familie zu Hause",goal:"No new words. Combine everything from Lessons 1 to 9 in one story about a family.",
 note:'Everything here is old vocabulary. Watch the verb position, <b>ist</b> versus <b>sind</b>, and the article for each noun.',
 plurals:['haus','mutter','vater'],
 items:[],
 sents:[
  {de:'Wo ist die Mutter?',en:'Where is the mother?',it:'mutter',bl:2},
  {de:'Sie ist hier.',en:'She is here.',it:'sie'},
  {de:'Er ist der Vater.',en:'He is the father.',it:'vater',bl:2},
  {de:'Das ist eine Familie.',en:'That is a family.',it:'familie',bl:2,why:'Familie is feminine (die Familie), so a/an is <b>eine</b>.'},
  {de:'Hier sind zwei Frauen und ein Mann.',en:'Here are two women and a man.',it:'zwei',bwhy:'Two or more people means sind. und joins the two groups.'},
  {de:'Ja, bitte, das Wasser.',en:'Yes, please, the water.',it:'wasser'}
 ]}
);
LESSONS.push(
{id:11,title:"Du bist, ich heiße",goal:"Talk to one person informally and say your name. Reuses Ich bin …, Wer ist das?, ja and die Mutter.",
 note:'<b>Sein</b> (to be) so far: <b>ich bin</b>, <b>du bist</b>, <b>er / sie ist</b>. <b>Du</b> is for friends, family and children. The polite <b>Sie</b> comes later. A yes/no question starts with the verb: <b>Bist</b> du …?',
 items:[
  {id:'du',de:'du',en:'you (informal)',acc:['you','you informal'],pron:'doo',type:'pronoun',ex:'Wer bist du?',exEn:'Who are you?',tip:'Long u, like “oo” in “moon”. Use du with friends, family and children.'},
  {id:'dubist',de:'Du bist …',en:'You are …',acc:['you are','youre','you re'],pron:'doo bist',type:'sentence pattern',ex:'Du bist die Mutter.',exEn:'You are the mother.',tip:'Short i as in “bit”. Say the final st clearly.',parts:'Du = you · bist = are · die Mutter = the mother'},
  {id:'heisse',de:'Ich heiße …',en:'My name is …',acc:['my name is','i am called','i am named','im called'],pron:'ikh HY-suh',type:'sentence pattern',ex:'Ich heiße Anna.',exEn:'My name is Anna.',tip:'ß is a sharp s, as in “hiss”. ei sounds like “eye”. Literally it means “I am called”.',parts:'Ich = I · heiße = am called · Anna = a name'}
 ],
 sents:[
  {de:'Du bist ein Mann.',en:'You are a man.',it:'dubist',bl:2,why:'Mann is masculine (der Mann), so a/an is <b>ein</b>.'},
  {de:'Du bist die Mutter.',en:'You are the mother.',it:'dubist',bl:2},
  {de:'Bist du die Mutter?',en:'Are you the mother?',it:'du',bl:2},
  {de:'Ja, ich bin die Mutter.',en:'Yes, I am the mother.',it:'ichbin'},
  {de:'Ich heiße Anna.',en:'My name is Anna.',it:'heisse'},
  {de:'Wer bist du?',en:'Who are you?',it:'wer',bwhy:'The question word Wer comes first, then the verb bist, then du.'}
 ]},
{id:12,title:"Vier, fünf, sechs",goal:"Count a little higher and count people and things. Reuses sind, plurals and Hier sind …",
 note:'After a number above one, the noun is plural and the verb is <b>sind</b>: vier Männer, fünf Türen.',
 plurals:['tuer','brot','frau'],
 items:[
  {id:'vier',de:'vier',en:'four',acc:['four','4'],pron:'feer',type:'number',ex:'Hier sind vier Männer.',exEn:'Here are four men.',tip:'v is pronounced like f here, and ie is a long “ee”.'},
  {id:'fuenf',de:'fünf',en:'five',acc:['five','5'],pron:'fuunf',type:'number',ex:'Das sind fünf Türen.',exEn:'Those are five doors.',tip:'ü as in Tür: lips round, say “ee”. The word ends in a clear f.'},
  {id:'sechs',de:'sechs',en:'six',acc:['six','6'],pron:'zeks',type:'number',ex:'Hier sind sechs Brote.',exEn:'Here are six loaves of bread.',tip:'s is voiced like z, and chs sounds like “ks”.'}
 ],
 sents:[
  {de:'Eins, zwei, drei, vier.',en:'One, two, three, four.',it:'vier'},
  {de:'Hier sind vier Männer.',en:'Here are four men.',it:'vier',bwhy:'vier is followed by a plural noun, and ist becomes sind.'},
  {de:'Das sind fünf Türen.',en:'Those are five doors.',it:'fuenf',bwhy:'Das sind … is the plural of Das ist ….'},
  {de:'Wo sind die sechs Häuser?',en:'Where are the six houses?',it:'sechs',bwhy:'Wo sind … is the plural of Wo ist ….'},
  {de:'Hier sind sechs Brote.',en:'Here are six loaves of bread.',it:'sechs',bwhy:'Brot becomes Brote in the plural.'}
 ]},

{id:16,title:"Der Apfel, den Apfel",goal:"Meet the accusative case: masculine nouns change when they are the object. Reuses Ich habe …, die Milch and Hast du …?",
 note:'The <b>accusative</b> marks the thing something happens to, such as the thing you have. Only masculine changes: <b>der → den</b>. <b>Die</b> and <b>das</b> stay the same. As the subject, der stays der: <b>Der Apfel ist hier.</b>',

 ]},

 ]},

const lvl=()=>Math.floor(G.xp/100)+1;

function intro(id){if(!G.led[id])G.led[id]={c:0,w:0,box:0,ctx:[],due:Date.now()}}
function rec(id,ctx,ok){intro(id);const l=G.led[id];
  if(ok){l.c++;if(!l.ctx.includes(ctx))l.ctx.push(ctx);l.box=Math.min(5,l.box+1)}
  else{l.w++;l.box=Math.max(0,l.box-2);const k=id+'|'+ctx;G.mist[k]=(G.mist[k]||0)+1}
  l.due=Date.now()+DAYS[l.box]*864e5;save()}
function status(id){const l=G.led[id];if(!l)return 'Not yet learned';
  if(l.c>=4&&l.ctx.length>=3)return 'Used independently';
  if(l.c>=2&&l.ctx.length>=2)return 'Recalled reliably';
  if(l.c>=1)return 'Recalled once';return 'Practicing'}
const dueIds=()=>Object.keys(G.led).filter(id=>G.led[id].due<=Date.now());

/* ---------- Audio ---------- */
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/…/g,''));u.lang='de-DE';u.rate=.8;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('de'));if(v)u.voice=v;speechSynthesis.speak(u)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say)});
function audioNote(){const ok='speechSynthesis' in window;const de=ok&&speechSynthesis.getVoices().some(v=>v.lang&&v.lang.toLowerCase().startsWith('de'));
  $('#audioNote').textContent=!ok?'Audio playback is not available in this browser. Use the written pronunciation guides.':
  !de?'No German voice found on this device, so playback may sound English. '+micNote():
  'Audio uses your device’s German voice. '+micNote()}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=audioNote;

/* ---------- Questions ---------- */
function itemQs(it){const q=[];
  if(it.art)q.push({it:it.id,ctx:'article',kind:'mc',prompt:`Which article goes with <b>${it.de}</b> (${it.en.replace('the ','')})?`,choices:['der','die','das'],ans:it.art,
    why:`${it.de} is ${it.gender}, so it is <b>${full(it)}</b>. Gender is not predictable from meaning, so learn each noun with its article.`});
  q.push({it:it.id,ctx:'de→en',kind:'type',prompt:`What does <b>${esc(full(it))}</b> mean?`,acc:it.acc.map(n),ans:it.en,why:'Check the meaning in the lesson card.'});
  q.push({it:it.id,ctx:'en→de',kind:'type',prompt:`How do you say <b>“${it.en}”</b> in German?${it.art?' Include the article.':''}`,acc:[n(full(it)),...(it.accDe||[]).map(n)],ans:full(it),
    why:it.art?`Noun and article together: <b>${full(it)}</b> (${it.gender}).`:`The German is <b>${it.de}</b>.`,noun:it.art?n(it.de):null});
  q.push({it:it.id,ctx:'speak',kind:'speak',prompt:`Say it aloud, slowly: <b>${esc(it.ex)}</b>`,say:it.ex,ans:it.ex,sub:it.pron+' · '+it.exEn,why:'Use Hear it, listen closely, then compare each word with your own.'});
  return q}
function sentQs(l){const q=[];l.sents.forEach(s=>{
  q.push({it:s.it,ctx:'build',kind:'tiles',prompt:`Build the sentence: <b>“${s.en}”</b>`,toks:s.de.split(' '),ans:s.de,why:s.bwhy||'In a German statement the verb stays in second position. Yes/no questions start with the verb.'});
  const t=s.de.split(' ');const a=t[s.bl];if(s.bl==null)return;
  q.push({it:s.it,ctx:'article-in-sentence',kind:'mc',prompt:`Fill the gap: <b>${t.map((w,i)=>i==s.bl?'___':w).join(' ')}</b><br><span class="tag">${s.en}</span>`,choices:s.ch||(['ein','eine'].includes(a)?['ein','eine']:['der','die','das']),ans:a,why:s.why||`${IT[s.it].de} is ${IT[s.it].gender}: <b>${full(IT[s.it])}</b>.`})});return q}
function plQ(id){const it=IT[id];return {it:id,ctx:'plural',kind:'type',prompt:`What is the plural of <b>${esc(full(it))}</b>? (Start with die.)`,acc:[n(it.plural),n(it.plural.replace('die ',''))],ans:it.plural,why:`Plurals are mostly irregular, so learn them with the noun: <b>${esc(full(it))}</b> → <b>${it.plural}</b>.`}}
function reviewQs(ids){return ids.flatMap(id=>{const it=IT[id];const pool=itemQs(it).filter(q=>q.kind!=='speak');return [shuf(pool)[0]]}).map(q=>({...q,review:true}))}

/* ---------- Views ---------- */
function stats(){$('#stats').innerHTML=`<span>Lv <b>${lvl()}</b></span><span><b>${G.xp}</b> XP</span><span>Streak <b>${streak}</b></span>`}
function view(h){stats();$('#app').innerHTML=h;window.scrollTo(0,0)}
const unlocked=i=>i===0||G.done.includes(LESSONS[i-1].id);

function home(){S=null;const due=dueIds();
  view(`<div class="card"><p class="q" style="margin-top:0">Willkommen! Start from zero, one small step at a time.</p>
  <p>Each lesson teaches a few words, then makes you recall them, build sentences with them and say them. Old words keep coming back on a schedule.</p></div>`+
  LESSONS.map((l,i)=>`<div class="card lesson"><div><h3>Lesson ${l.id}: ${l.title}</h3><p>${l.goal}</p>${G.done.includes(l.id)?'<p>Completed. Replay any time.</p>':''}</div>
  <button class="p" ${unlocked(i)?'':'disabled'} onclick="startLesson(${i})">${G.done.includes(l.id)?'Replay':unlocked(i)?'Start':'Locked'}</button></div>`).join('')+
  `<div class="row"><button onclick="startReview()" ${due.length?'':'disabled'}>Review due words (${due.length})</button><button onclick="progress()">Progress and ledger</button></div>`)}

function startLesson(i){const l=LESSONS[i];S={li:i,phase:'learn',ci:0,cards:[...l.items,'sents']};learnView()}
function learnView(){const l=LESSONS[S.li],c=S.cards[S.ci],last=S.ci===S.cards.length-1;
  let body;
  if(c==='sents'){body=`<p class="tag">Put it together</p><p class="q">Now these words work as sentences.</p>`+l.sents.map(s=>`<div class="sent"><div><b>${s.de}</b><small>${s.en}</small></div><button data-say="${s.de}" aria-label="Hear ${s.de}">Hear</button></div>`).join('')+
    `<p class="note">${l.note||'The word order is the same each time: a first word, then <b>ist</b>, then the thing.'}</p>`}
  else{intro(c.id);save();body=`<p class="tag">${c.type}${c.gender?' · '+c.gender:''}</p>
  <div class="de ${gcls(c)}">${esc(full(c))}</div><div class="pron">${c.pron}</div>
  <dl class="meta"><dt>Meaning</dt><dd>${c.en}</dd>${c.plural?`<dt>Plural</dt><dd>${c.plural}</dd>`:''}${c.parts?`<dt>Breakdown</dt><dd>${c.parts}</dd>`:''}<dt>Example</dt><dd><b>${c.ex}</b><br>${c.exEn}</dd></dl>
  <div class="tip">${c.tip}</div><button data-say="${esc(full(c))}">Hear word</button> <button data-say="${c.ex}">Hear example</button>`}
  view(`<div class="card"><div class="bar"><i style="width:${(S.ci+1)/S.cards.length*100}%"></i></div>${body}
  <div class="row"><button onclick="home()">Exit</button><button class="p" onclick="${last?'startQuiz()':'S.ci++;learnView()'}">${last?'Start challenge':'Next'}</button></div></div>`)}

function startQuiz(){const l=LESSONS[S.li];
  const prev=dueIds().filter(id=>IT[id].lesson<l.id);
  const rev=reviewQs(shuf(prev).slice(0,3));
  S.q=[...rev,...shuf(l.items.flatMap(itemQs)),...shuf(sentQs(l)),...shuf((l.plurals||[]).map(plQ))];S.qi=0;S.right=0;S.total=0;S.phase='quiz';S.lessonId=l.id;quizView()}
function startReview(){const ids=shuf(dueIds()).slice(0,8);S={li:-1,phase:'quiz',q:reviewQs(ids),qi:0,right:0,total:0};quizView()}

function quizView(){if(S.qi>=S.q.length)return finish();
  const q=S.q[S.qi];S.cur=q;S.tray=[];
  let ui='';
  if(q.kind==='mc')ui=`<div class="row">${q.choices.map(c=>`<button class="mc" data-c="${c}">${c}</button>`).join('')}</div>`;
  if(q.kind==='type')ui=`<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><div class="row"><button class="p" id="chk">Check</button></div>`;
  if(q.kind==='tiles'){S.pool=shuf(q.toks.map((t,i)=>({t,i})));ui=`<div class="tray" id="tray" aria-label="Your sentence"></div><div class="tiles row" id="pool"></div><div class="row"><button onclick="resetTiles()">Reset</button><button class="p" id="chk">Check</button></div>`}
  if(q.kind==='speak')ui=`<p class="tag">${q.sub}</p><div class="row"><button data-say="${esc(q.say)}">Hear it</button><button class="p" id="said">I said it aloud</button></div><div id="heard"></div>`;
  view(`<div class="card"><div class="bar"><i style="width:${S.qi/S.q.length*100}%"></i></div>
  <p class="tag">${q.review?'Review':q.ctx}</p><p class="q">${q.prompt}</p>${ui}<div id="fb"></div></div>`);
  if(q.kind==='mc')document.querySelectorAll('.mc').forEach(b=>b.onclick=()=>grade(b.dataset.c===q.ans,b.dataset.c));
  if(q.kind==='type'){const a=$('#ans');a.focus();const go=()=>{const v=a.value;if(!v.trim())return;const nv=n(v);
    grade(q.acc.includes(nv),v,q.noun&&nv.endsWith(' '+q.noun)||nv===q.noun?'article':null)};$('#chk').onclick=go;a.onkeydown=e=>{if(e.key==='Enter')go()}}
  if(q.kind==='tiles'){drawTiles();$('#chk').onclick=()=>{if(!S.tray.length)return;const v=S.tray.map(x=>x.t).join(' ');grade(v===q.ans,v)}}
  if(q.kind==='speak')setupSpeak(q)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function micNote(){return SR?'The microphone check listens for German and compares your words with the target. It does not score your accent. In Chrome the audio is processed by Google’s speech service.':'This browser has no speech recognition (try Chrome, Edge or Safari), so speaking exercises are self-checked.'}
function setupSpeak(q){const said=$('#said');said.onclick=()=>grade(true,'(self-checked)');
  if(!SR){said.textContent='I said it aloud (self-check)';return}
  const mic=document.createElement('button');mic.className='p';mic.textContent='Speak now';said.parentNode.insertBefore(mic,said);
  said.className='';said.textContent='Skip: self-check';
  const T=q.say.split(' ').map(n).filter(Boolean);let tries=0;
  const out=h=>$('#heard').innerHTML=h;
  mic.onclick=()=>{let r;try{r=new SR()}catch(e){return}
    r.lang='de-DE';r.maxAlternatives=3;r.interimResults=false;
    mic.disabled=true;mic.textContent='Listening…';out('');let got=false;
    r.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);
      const score=a=>{const w=new Set(a.split(' ').map(n));return T.filter(t=>w.has(t)).length};
      const best=alts.sort((a,b)=>score(b)-score(a))[0];const w=new Set(best.split(' ').map(n));
      const marked=q.say.split(' ').map(x=>`<span class="${w.has(n(x))?'hit':'miss'}">${esc(x)}</span>`).join(' ');
      if(T.every(t=>w.has(t))){grade(true,best,'heard');return}
      tries++;
      out(`<div class="fb bad"><div><b>Target:</b> ${marked}</div><div><b>Heard:</b> ${esc(best)}</div><div>Underlined words were not recognized. Use Hear it, then try again. A match only means the recognizer understood you.</div>${tries>=2?'<div class="row"><button id="mv">Move on</button></div>':''}</div>`);
      const mv=$('#mv');if(mv)mv.onclick=()=>grade(false,best)};
    r.onerror=e=>{got=true;out(`<div class="fb bad">${e.error==='not-allowed'||e.error==='service-not-allowed'?'Microphone blocked. Allow microphone access for this page, or use Skip: self-check.':e.error==='no-speech'?'No speech heard. Check your microphone and try again.':'Speech recognition failed ('+esc(e.error)+'). Try again or use Skip: self-check.'}</div>`)};
    r.onend=()=>{if(S.locked)return;if(!got)out('<div class="fb bad">Nothing was recognized. Speak right after pressing the button.</div>');mic.disabled=false;mic.textContent=tries?'Try again':'Speak now'};
    r.start()}}
function drawTiles(){$('#tray').innerHTML=S.tray.map((x,k)=>`<button onclick="untile(${k})">${esc(x.t)}</button>`).join('');
  $('#pool').innerHTML=S.pool.map((x,k)=>`<button onclick="tile(${k})">${esc(x.t)}</button>`).join('')}
function tile(k){S.tray.push(S.pool.splice(k,1)[0]);drawTiles()}
function untile(k){S.pool.push(S.tray.splice(k,1)[0]);drawTiles()}
function resetTiles(){S.pool=S.pool.concat(S.tray);S.tray=[];drawTiles()}

function grade(ok,given,hint){const q=S.cur;if(S.locked)return;S.locked=true;
  document.querySelectorAll('#app button,#app input').forEach(b=>{if(!b.hasAttribute('data-say'))b.disabled=true});
  if(!q.retry||ok){S.total++}
  rec(q.it,q.ctx==='speak'?'speak':q.ctx,ok);
  let fb;
  if(ok){streak++;const xp=q.kind==='speak'?(hint==='heard'?8:3):q.retry?5:10;G.xp+=xp;if(!q.retry)S.right++;
    fb=`<div class="fb ok"><div><b>Richtig!</b> +${xp} XP</div>${q.kind==='speak'&&given==='(self-checked)'?'<div class="note">This was your own check, so no accuracy is recorded.</div>':''}${hint==='heard'?'<div class="note">The recognizer understood every word. That shows you were understandable, not that your accent is perfect.</div>':''}</div>`}
  else{streak=0;
    const lab=q.ctx==='de→en'?'Correct meaning':'Correct German';
    fb=`<div class="fb bad"><div><b>My answer:</b> ${esc(given)}</div><div><b>${lab}:</b> ${esc(q.ans)}</div>
    <div><b>What changed:</b> ${hint==='article'?'The noun is right, but the article is wrong. ':''}${q.why}</div><div><b>Try again:</b> this one comes back in a few questions.</div></div>`;
    const re={...q,retry:true};S.q.splice(Math.min(S.q.length,S.qi+4),0,re)}
  save();stats();
  $('#fb').innerHTML=fb+`<div class="row"><button class="p" id="nx">Next</button></div>`;
  const nx=$('#nx');nx.focus();nx.onclick=()=>{S.locked=false;S.qi++;quizView()}}

function finish(){const l=LESSONS[S.li];
  if(l&&!G.done.includes(l.id)){G.done.push(l.id);save()}
  const ids=l?l.items.map(i=>i.id):[];
  const nxt=l&&LESSONS[S.li+1];
  view(`<div class="card"><p class="tag">${l?'Lesson '+l.id+' complete':'Review complete'}</p><p class="q">${S.right} of ${S.total} answered correctly first time.</p>
  <p>${S.right===S.total?'Clean run. Tomorrow’s review will still check it, because one session does not make a word stick.':'The missed items have been scheduled to return sooner.'}</p>
  ${ids.length?`<table><tr><th>Word</th><th>Status</th></tr>${ids.map(id=>`<tr><td>${esc(full(IT[id]))}</td><td>${status(id)}</td></tr>`).join('')}</table>`:''}
  <div class="row">${nxt?`<button class="p" onclick="startLesson(${S.li+1})">Next: Lesson ${nxt.id}</button>`:''}<button onclick="progress()">Progress and ledger</button><button onclick="home()">Home</button></div></div>`)}

function progress(){const ids=Object.keys(G.led);
  const nouns=ids.filter(id=>IT[id].art&&G.led[id].ctx.includes('article')&&G.led[id].c>=2).length;
  const mist=Object.entries(G.mist).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const led=JSON.stringify({level:'A0 (beginner, not formally assessed)',xp:G.xp,lessonsDone:G.done,ledger:G.led,mistakes:G.mist});
  view(`<div class="card"><p class="q" style="margin-top:0">Progress snapshot</p>
  <dl class="meta"><dt>Estimated level</dt><dd>A0, just starting (an estimate, not a test result)</dd><dt>Lesson</dt><dd>${G.done.length} of ${LESSONS.length} completed</dd>
  <dt>Words introduced</dt><dd>${ids.length} of the 20,000 target</dd><dt>Nouns with article recalled</dt><dd>${nouns}</dd><dt>XP / level</dt><dd>${G.xp} / ${lvl()}</dd><dt>Review due</dt><dd>${dueIds().length}</dd>
  <dt>Recurring mistakes</dt><dd>${mist.length?mist.map(m=>m[0].replace('|',' · ')+' ×'+m[1]).join('<br>'):'none yet'}</dd></dl>
  ${ids.length?`<table><tr><th>Word</th><th>Status</th><th>Next review</th></tr>${ids.map(id=>{const l=G.led[id],d=Math.max(0,Math.ceil((l.due-Date.now())/864e5));return `<tr><td>${esc(full(IT[id]))}</td><td>${status(id)}</td><td>${d?'in '+d+' d':'now'}</td></tr>`}).join('')}</table>`:'<p>No words yet. Start Lesson 1.</p>'}</div>
  <div class="card"><p><b>Portable ledger</b></p><p class="note">Copy this text and keep it somewhere safe. Paste it below later to restore your progress, for example on another device.</p>
  <textarea id="led" aria-label="Ledger">${esc(led)}</textarea>
  <div class="row"><button onclick="navigator.clipboard&&navigator.clipboard.writeText($('#led').value)">Copy ledger</button><button class="p" onclick="imp()">Restore from text</button><button onclick="home()">Home</button></div><div id="imsg" class="note"></div></div>`)}
function imp(){try{const o=JSON.parse($('#led').value);if(!o.ledger)throw 0;G={xp:o.xp||0,led:o.ledger,mist:o.mistakes||{},done:o.lessonsDone||[]};save();stats();$('#imsg').textContent='Progress restored.'}catch(e){$('#imsg').textContent='That text is not a valid ledger.'}}

audioNote();home();
</script>
</body>
</html>
